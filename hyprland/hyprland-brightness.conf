# =============================================================================
# Hyprland Brightness Configuration: Dual Monitor & External Layer Dimmer
# =============================================================================
# Source this file in your hyprland.conf:
#   source = ~/.config/hypr/hyprland-brightness.conf
# or copy these directives directly into your existing configuration.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Environment & Autostart
# -----------------------------------------------------------------------------
# Ensure Wayland display and Hyprland instance signature are exported to systemd
# so the background dimmer daemon and socket listeners can communicate seamlessly:
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Start the external monitor layer dimmer service via systemd user manager
# (Falls back automatically if not running when brightness keys are pressed)
exec-once = systemctl --user start monitor-dimmer.service

# If you prefer running without systemd, you can alternatively use:
# exec-once = hypr-monitor-dimmer.py

# -----------------------------------------------------------------------------
# 2. Keybindings
# -----------------------------------------------------------------------------
$mainMod = SUPER

# --- Option A: Context-Aware Smart Brightness (Auto-detects focused screen) ---
# When focusing an external monitor (HDMI/DP), adjusts the external screen.
# When focusing the laptop screen (eDP-1), adjusts laptop backlight.
binde = , XF86MonBrightnessUp, exec, hypr-brightness.sh --inc
binde = , XF86MonBrightnessDown, exec, hypr-brightness.sh --dec

# --- Option B: Explicit Independent Screen Keybindings ---

# Laptop Internal Screen (Dedicated hardware keys or Fn keys)
binde = , XF86MonBrightnessUp, exec, hypr-brightness.sh --int-inc
binde = , XF86MonBrightnessDown, exec, hypr-brightness.sh --int-dec

# External Monitor Brightness with SUPER / Modifier
# Super + Brightness Keys
binde = $mainMod, XF86MonBrightnessUp, exec, hypr-brightness.sh --ext-inc
binde = $mainMod, XF86MonBrightnessDown, exec, hypr-brightness.sh --ext-dec

# Alt + Brightness Keys (Alternative)
# binde = ALT, XF86MonBrightnessUp, exec, hypr-brightness.sh --ext-inc
# binde = ALT, XF86MonBrightnessDown, exec, hypr-brightness.sh --ext-dec

# Function Key Fallbacks (Useful if keyboard lacks dedicated brightness keys)
binde = $mainMod, F1, exec, hypr-brightness.sh --dec
binde = $mainMod, F2, exec, hypr-brightness.sh --inc
binde = $mainMod SHIFT, F1, exec, hypr-brightness.sh --ext-dec
binde = $mainMod SHIFT, F2, exec, hypr-brightness.sh --ext-inc

# -----------------------------------------------------------------------------
# 3. Layer Rules & Animations
# -----------------------------------------------------------------------------
# Disable transition animations on the dimmer layer for instant response
layerrule = noanim, gtk-layer-shell
